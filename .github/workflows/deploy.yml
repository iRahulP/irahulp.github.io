name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'deploy:')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          # Try reproducible install first; if optional native bindings fail,
          # retry by removing lockfile and doing a fresh install (workaround).
          npm ci || (rm -rf node_modules package-lock.json && npm i)

      - name: Build
        run: npm run build

      - name: Copy `dist` to `/docs`
        run: |
          rm -rf docs
          mkdir -p docs
          ls -la dist || (echo "dist not found" && exit 1)
          cp -a dist/. docs/
          touch docs/.nojekyll

      - name: Commit and push build to `main`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "deploy: update docs build [skip ci]"
            git push origin HEAD:main
          fi
